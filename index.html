<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maani Nexora — ڈاؤنلوڈ</title>
<style>
  :root {
    --bg: #f3f6f4;
    --ink: #14211c;
    --muted: #55655e;
    --card: #ffffff;
    --line: #d5dfda;
    --green: #0f6b4f;
    --green-dark: #0a4d39;
    --teal: #1b7f93;
    --teal-dark: #135e6e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101815;
      --ink: #eaf2ee;
      --muted: #9db0a8;
      --card: #18231f;
      --line: #2a3a34;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Segoe UI", Tahoma, Arial, sans-serif;
    line-height: 1.9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 2rem; margin: 0 0 4px; text-align: center; }
  p.sub { margin: 0 0 28px; text-align: center; color: var(--muted); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 2px; font-size: 1.15rem; }
  .card p { margin: 0 0 14px; color: var(--muted); font-size: .95rem; }
  .btn {
    display: block;
    text-align: center;
    text-decoration: none;
    color: #fff;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 12px 16px;
    border-radius: 10px;
  }
  .btn:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }
  .all { background: var(--green); }
  .all:hover { background: var(--green-dark); }
  .lite { background: var(--teal); }
  .lite:hover { background: var(--teal-dark); }
  .ver { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <h1>Maani Nexora</h1>
  <p class="sub">اپنے موبائل کے مطابق ایپ منتخب کریں</p>

  <section class="card">
    <h2>All Phones</h2>
    <p>تمام موبائل فونز کے لیے · 106 MB</p>
    <a class="btn all" href="https://github.com/AneesBhatti432/maani-nexora/releases/download/v1.2/MaaniNexora-v1.2-AllPhones.apk">
      All Phones ڈاؤنلوڈ کریں
    </a>
  </section>

  <section class="card">
    <h2>Lite</h2>
    <p>چھوٹے اور کم میموری والے موبائل کے لیے · 64.7 MB</p>
    <a class="btn lite" href="https://github.com/AneesBhatti432/maani-nexora/releases/download/v1.2/MaaniNexora-v1.2-Lite.apk">
      Lite ڈاؤنلوڈ کریں
    </a>
  </section>

  <p class="ver">ورژن 1.2</p>
</main>
</body>
</html>
